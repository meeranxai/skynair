org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:SoftRefLRUPolicyMSPerMB=50 -XX:+TieredCompilation -XX:TieredStopAtLevel=1
org.gradle.vfs.watch=true
org.gradle.java.home=E:\\Android Studio\\jbr
android.useAndroidX=true
android.enableJetifier=true

# Performance Optimizations
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn
# android.enableBuildCache=true (Removed as it is deprecated and removed in AGP 7.0+)

# Network timeout settings
systemProp.http.connectionTimeout=600000
systemProp.http.socketTimeout=600000
systemProp.https.connectionTimeout=600000
systemProp.https.socketTimeout=600000

# Java toolchain configuration
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false

# Build Speed Improvements
android.enableR8.fullMode=false
android.enableD8=true

# Kotlin Optimizations
kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true

# Disable unnecessary features
android.nonTransitiveRClass=true
android.nonFinalResIds=true
kotlin.daemon.jvm.options=-Xmx4G
